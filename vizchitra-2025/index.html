<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizing Photos from VizChitra</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }
    svg {
      display: block;
      margin: 0;
      width: 100%;
      height: auto;
    }

    #chart-wrapper {
      position: relative;
      width: 900px;
      margin: 20px auto;
    }

    #chart-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    #chart-title {
      position: absolute;
      top: 30px;
      left: 20px;
      font-size: 20px;
      font-weight: bold;
      color: #333;
    }

    #chart-subtitle {
      position: absolute;
      top: 58px;
      left: 20px;
      font-size: 11px;
      color: #666;
      line-height: 1.5;
      max-width: 220px;
    }

    #chart-subtitle a {
      color: #555;
    }

    #filter-panel {
      position: absolute;
      top: 100px;
      left: 750px;
      pointer-events: auto;
    }

    .filter-group {
      margin-bottom: 8px;
    }

    .filter-label {
      display: block;
      font-size: 9px;
      color: #aaa;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .filter-btn {
      font-size: 10px;
      height: 20px;
      padding: 0 8px;
      border-radius: 4px;
      border: 0.5px solid #bbb;
      cursor: pointer;
      background: #eee;
      color: #888;
      margin-right: 4px;
      font-family: sans-serif;
    }

    .filter-btn.active {
      background: #333;
      color: white;
    }

    @media (max-width: 900px) {
      #chart-wrapper {
        width: 100%;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      #chart-overlay {
        position: static;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px 16px 12px;
        box-sizing: border-box;
        gap: 12px;
      }

      #chart-title {
        position: static;
        font-size: 20px;
        text-align: center;
      }

      #chart-subtitle {
        position: static;
        max-width: 100%;
        text-align: center;
        margin-bottom: 8px;
      }

      #filter-panel {
        position: static;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px 20px;
      }

      .filter-group {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 0;
      }

      .filter-label {
        text-align: center;
        margin-bottom: 6px;
      }

      .filter-btn {
        height: 36px;
        padding: 0 14px;
        font-size: 13px;
        border-radius: 6px;
      }
    }

    #photo-modal {
      position: fixed; inset: 0; z-index: 1000;
      display: none; align-items: center; justify-content: center;
      background: rgba(10, 10, 12, 0.88);
      backdrop-filter: blur(4px);
      padding: 1rem; box-sizing: border-box; cursor: zoom-out;
    }
    #photo-modal.is-open { display: flex; }
    body.modal-open { overflow: hidden; }
    #photo-modal-card {
      background: #fff; border-radius: 3px;
      padding: 1.25rem 1.25rem 1.6rem;
      max-width: min(92vw, 1100px); max-height: 92vh;
      box-sizing: border-box;
      transform: rotate(var(--modal-tilt, -1deg));
      box-shadow: 0 26px 45px rgba(35,25,18,.28), 0 10px 14px rgba(35,25,18,.2);
      cursor: default;
    }
    #photo-modal-inner { width: fit-content; max-width: min(84vw, 1000px); }
    #photo-modal img {
      max-width: min(84vw, 1000px); max-height: 72vh;
      width: auto; height: auto; display: block; border-radius: 2px;
    }
    #photo-modal video {
      display: block; border-radius: 2px; object-fit: contain;
    }
    #photo-modal-caption {
      margin: 0.7rem 0 0; text-align: center;
      font-family: sans-serif; font-size: 0.85rem; color: #555;
    }
    g.shape {
      transition: filter 200ms ease;
    }
    .has-active g.shape {
      filter: blur(2px);
    }
    .has-active g.shape.active-node {
      filter: none;
    }

    /* ── Gradient background ──────────────────────────────────────────── */
    .back-link {
      display: table;
      margin: 1.5rem auto 2rem;
      padding: 0.4rem 1rem;
      font-family: sans-serif; font-size: 0.85rem;
      color: #555; text-decoration: underline;
      border-radius: 4px;
      transition: background 150ms ease, color 150ms ease;
    }
    .back-link:hover { background: #333; color: #fff; text-decoration: none; }

    /* ── Gradient background ──────────────────────────────────────────── */
    #gradient-bg {
      position: fixed; inset: 0; z-index: -1;
      pointer-events: none; overflow: hidden;
      background:
        radial-gradient(ellipse 76% 65% at 10% 15%, rgba(224,123,57,0.250) 0%, transparent 70%),
        radial-gradient(ellipse 68% 79% at 88% 10%, rgba(91,196,180,0.250) 0%, transparent 70%),
        radial-gradient(ellipse 94% 68% at 52% 90%, rgba(240,192,96,0.250) 0%, transparent 70%),
        radial-gradient(ellipse 65% 79% at 80% 60%, rgba(155,142,196,0.250) 0%, transparent 70%),
        radial-gradient(ellipse 68% 58% at 20% 78%, rgba(232,139,173,0.250) 0%, transparent 70%),
        radial-gradient(ellipse 58% 68% at 56% 40%, rgba(168,216,232,0.250) 0%, transparent 70%),
        #fff;
    }
  </style>
</head>
<body>
  <div id="gradient-bg" aria-hidden="true"></div>
  <div id="chart-wrapper">
    <div id="chart-overlay">
      <div id="chart-title">Visualizing a day of VizChitra 2025</div>
      <div id="chart-subtitle">A <em>photo-graph</em> of every photo &amp; video I took at VizChitra 2025 conference. <a href="http://rasagy.in/projects/photo-graphs-vizchitra-2025/">Read more about the project here</a>.</div>
      <div id="filter-panel">
        <div class="filter-group">
          <span class="filter-label">TYPE</span>
          <button class="filter-btn active" id="btn-photos">Photos</button>
          <button class="filter-btn active" id="btn-videos">Videos</button>
        </div>
        <div class="filter-group">
          <span class="filter-label">ORIENTATION</span>
          <button class="filter-btn active" id="btn-horizontal">Horizontal</button>
          <button class="filter-btn active" id="btn-vertical">Vertical</button>
        </div>
        <div class="filter-group">
          <span class="filter-label">ANNOTATIONS</span>
          <button class="filter-btn" id="btn-annotations">Show labels</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Load D3.js -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <!-- Load d3-annotation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-annotation/2.5.1/d3-annotation.min.js"></script>

  <!-- Your visualization code will go here -->
  <script src="script.js"></script>

  <a class="back-link" href="../">View more photo-graphs</a>
</body>
</html>
