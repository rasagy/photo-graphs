<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Visualizing Photos from VizChitra</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }
    svg {
      display: block;
      margin: 20px auto;
    }

    #photo-modal {
      position: fixed; inset: 0; z-index: 1000;
      display: none; align-items: center; justify-content: center;
      background: rgba(10, 10, 12, 0.88);
      backdrop-filter: blur(4px);
      padding: 1rem; box-sizing: border-box; cursor: zoom-out;
    }
    #photo-modal.is-open { display: flex; }
    body.modal-open { overflow: hidden; }
    #photo-modal-card {
      background: #fff; border-radius: 3px;
      padding: 1.25rem 1.25rem 1.6rem;
      max-width: min(92vw, 1100px); max-height: 92vh;
      box-sizing: border-box;
      transform: rotate(var(--modal-tilt, -1deg));
      box-shadow: 0 26px 45px rgba(35,25,18,.28), 0 10px 14px rgba(35,25,18,.2);
      cursor: default;
    }
    #photo-modal-inner { width: fit-content; max-width: min(84vw, 1000px); }
    #photo-modal img {
      max-width: min(84vw, 1000px); max-height: 72vh;
      width: auto; height: auto; display: block; border-radius: 2px;
    }
    #photo-modal video {
      display: block; border-radius: 2px; object-fit: contain;
    }
    #photo-modal-caption {
      margin: 0.7rem 0 0; text-align: center;
      font-family: sans-serif; font-size: 0.85rem; color: #555;
    }
    g.shape {
      transition: filter 200ms ease;
    }
    .has-active g.shape {
      filter: blur(2px);
    }
    .has-active g.shape.active-node {
      filter: none;
    }

    /* ── Gradient background ──────────────────────────────────────────── */
    .back-link {
      display: block; text-align: center;
      padding: 1rem 0 2rem;
      font-family: sans-serif; font-size: 0.85rem;
      color: #555; text-decoration: none;
    }
    .back-link:hover { color: #111; text-decoration: underline; }

    /* ── Gradient background ──────────────────────────────────────────── */
    #gradient-bg {
      position: fixed; inset: 0; z-index: -1;
      pointer-events: none; overflow: hidden;
      background:
        radial-gradient(ellipse 76% 65% at 10% 15%, rgba(224,123,57,0.250) 0%, transparent 70%),
        radial-gradient(ellipse 68% 79% at 88% 10%, rgba(91,196,180,0.250) 0%, transparent 70%),
        radial-gradient(ellipse 94% 68% at 52% 90%, rgba(240,192,96,0.250) 0%, transparent 70%),
        radial-gradient(ellipse 65% 79% at 80% 60%, rgba(155,142,196,0.250) 0%, transparent 70%),
        radial-gradient(ellipse 68% 58% at 20% 78%, rgba(232,139,173,0.250) 0%, transparent 70%),
        radial-gradient(ellipse 58% 68% at 56% 40%, rgba(168,216,232,0.250) 0%, transparent 70%),
        #fff;
    }
  </style>
</head>
<body>
  <div id="gradient-bg" aria-hidden="true"></div>
  <div id="chart"></div>

  <!-- Load D3.js -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <!-- Load d3-annotation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-annotation/2.5.1/d3-annotation.min.js"></script>

  <!-- Your visualization code will go here -->
  <script src="script.js"></script>

  <a class="back-link" href="../">View more photo-graphs</a>
</body>
</html>
